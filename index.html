<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo 3D - Three.js</title>
  <link rel="stylesheet" href="style.css">
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="canvas3d"></canvas>

  <!-- Painel de Controle de Animações do Personagem -->
  <div id="anim-panel">
    <div class="panel-header">
      <span class="panel-title">Animações do Personagem</span>
    </div>
    <div class="btn-group">
      <button class="anim-btn active" data-anim="waveanimation">👋 Acenar</button>
      <button class="anim-btn" data-anim="walkanimation">🚶 Andar</button>
      <button class="anim-btn" data-anim="sitanimation">🪑 Sentar</button>
      <button class="anim-btn stop-btn" data-anim="stop">⏹️ Parar</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
